<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Trilot designs and builds thoughtful websites and digital products for ambitious businesses." />

  <meta name="theme-color" content="#102A43" />

  <meta property="og:title" content="Trilot|Digital experiences built to move business forward" />
  <meta property="og:description" content="Thoughtful websites and digital products for ambitious businesses." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="/trilot.png" />

  <title>Trilot — Digital experiences built to move business forward</title>
  <script>
  (function () {
    try {
      var stored = localStorage.getItem("trilot-theme");
      var theme =
        stored === "light" || stored === "dark"
          ? stored
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      }
      document.documentElement.style.colorScheme = theme;
    } catch (e) {}
  })();
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
